<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BlindfoldDate</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 32px;
    box-sizing: border-box;
    text-align: center;
    gap: 16px;
  }
  .icon-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(244, 63, 94, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }
  p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    max-width: 320px;
  }
  button {
    margin-top: 16px;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #f43f5e;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon-circle">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12" y2="20.01"></line>
      </svg>
    </div>
    <h1>No internet connection</h1>
    <p>Check your Wi-Fi or mobile data, then try again — we'll reconnect automatically once you're back online.</p>
    <button id="retry-btn">Retry</button>
  </div>

  <script>
    var REMOTE_URL = 'https://blindfolddate.com/app-intro';

    function reload() {
      window.location.href = REMOTE_URL;
    }

    document.getElementById('retry-btn').addEventListener('click', function () {
      var btn = document.getElementById('retry-btn');
      btn.disabled = true;
      btn.textContent = 'Retrying...';
      reload();
    });

    // Capacitor's JS bridge only injects into the remote server.url origin,
    // not this local errorPath page, so window.Capacitor isn't available here.
    // Use the plain browser online event instead of @capacitor/network.
    window.addEventListener('online', reload);
  </script>
</body>
</html>
